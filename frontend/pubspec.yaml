name: hifazat_app
description: "A community safety and crime reporting application."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # For iOS styled icons
  cupertino_icons: ^1.0.6

  # API Integration
  dio: ^5.4.1 
  json_annotation: ^4.8.1

  # State Management
  provider: ^6.1.1 

  # Mapping
  flutter_map: ^7.0.2
  latlong2: ^0.9.0 
  geolocator: ^11.0.0 

  flutter_map_heatmap: ^0.0.8

  # Local Storage
  shared_preferences: ^2.2.2 

  # UI Enhancements
  font_awesome_flutter: ^10.7.0 
  intl: ^0.19.0 
  flutter_spinkit: ^5.2.0

  # Data Visualization
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true